directories:
  raw_audio: "./to-transcribe"
  transcriptions: "./transcription-out"
  notes: "./notes-out"
  templates: "./templates"

models:
  whisper: "base"
  llm: "llama3.1:8b"
  ollama_url: "http://localhost:11434"

audio:
  sample_rate: 16000
  channels: 2
  chunk_size: 1024
  format: "wav"

monitoring:
  warning_minutes: 60
  warning_interval: 15
  max_recording_hours: 8

notes_chat:
  emb_model: "nomic-embed-text"
  chunk_size: 1000
  overlap: 200
  k: 10
  ctx_char_budget: 8000
  index_dir: ".notes_index"
  auto_index: true
