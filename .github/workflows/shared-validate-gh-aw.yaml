name: Validate gh-aw Workflows

on:
  workflow_call:
    inputs:
      gh-aw-version:
        description: 'Version tag of github/gh-aw to install (e.g. v0.74.3)'
        required: false
        type: string
        default: 'v0.74.3'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⤵️ Checkout code
        uses: actions/checkout@v6

      - name: 🛠️ Install gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@v0.74.3
        with:
          version: ${{ inputs.gh-aw-version }}

      - name: 🔍 Validate gh-aw workflows (compile + actionlint + zizmor + poutine)
        run: gh aw validate --strict

      - name: 🔒 Compile workflows
        run: gh aw compile --strict

      - name: 🚦 Verify committed lock files match sources
        run: |
          if ! git diff --exit-code -- '.github/workflows/*.lock.yml' '.github/aw/actions-lock.json'; then
            echo "::error::gh-aw lock files are out of date. Run 'gh aw compile' locally and commit the result."
            exit 1
          fi
