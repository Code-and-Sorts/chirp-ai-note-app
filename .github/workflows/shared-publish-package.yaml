name: Publish Package

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      is-test-pypi:
        description: 'Whether to publish to TestPyPI or PyPI'
        required: false
        type: boolean
        default: true
    outputs:
      published-version:
        description: 'The version that was published'
        value: 'published'

jobs:
  publish-package:
    runs-on: macos-latest
    environment: release
    env:
      pypi-repository: ${{ inputs.is-test-pypi && 'testpypi' || 'pypi' }}
    permissions:
      pull-requests: write
      id-token: write

    steps:
    - name: 🐍 Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: 🚀 Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: ⤵️ Download dist artifacts
      uses: actions/download-artifact@v8
      with:
        name: python-package-dist
        path: dist/

    - name: Install Twine
      run: uv pip install twine --system

    - name: 📦 Publish to ${{ env.pypi-repository }}
      # Wheel-only (see shared-build-and-test.yaml). We never publish an sdist:
      # the macOS-arm64 Swift helper can't be built from source off a macOS host
      # with Xcode CLT, and a user-side rebuild would break its TCC identity.
      # --attestations publishes PEP 740 provenance via the OIDC trusted
      # publisher, so installers can verify the wheel (which bundles a Mach-O
      # helper) came from this repo's CI.
      run: twine upload --verbose --attestations --repository ${{ env.pypi-repository }} dist/*.whl

    - name: Read version for comment
      id: version_info
      run: |
        if [ -f "dist/VERSION.txt" ]; then
          VERSION=$(cat dist/VERSION.txt)
        elif [ -f "pyproject.toml" ]; then
          VERSION=$(uv run python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
        else
          VERSION=$(ls dist/*.whl | head -1 | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+[^-]*')
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Comment on PR with publish info
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' && comment.body.includes('📦 Package Published')
          );

          const repository = '${{ env.pypi-repository }}';
          const version = '${{ steps.version_info.outputs.version }}';
          const repositoryUrl = repository === 'testpypi'
            ? 'https://test.pypi.org'
            : 'https://pypi.org';

          const body = `## 📦 Package Published to ${repository === 'testpypi' ? 'TestPyPI' : 'PyPI'}

          **Version:** \`${version}\`
          **Repository:** [${repository}](${repositoryUrl})

          ${repository === 'testpypi' ?
            `🧪 This is a test release. Install with:\n\`\`\`bash\npip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ chirp-notes-ai==${version}\n\`\`\`` :
            '🚀 Production release is now available:\n```bash\npip install chirp-notes-ai\n```'
          }`;

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
