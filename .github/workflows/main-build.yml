name: Main Branch Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run quality checks
      uses: ./.github/actions/quality-checks

    - name: Run tests
      # Bare `--cov` uses the full [tool.coverage.run] source set in
      # pyproject.toml (all 10 packages), matching shared-build-and-test.yaml so
      # both gates measure the same surface. The fail_under floor lives in
      # pyproject [tool.coverage.report].
      run: |
        uv run pytest tests/ -n auto --cov --cov-report=xml --cov-report=term

    - name: Build package
      # Wheel-only distribution (see shared-build-and-test.yaml); never build an sdist.
      run: |
        uv build --wheel

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: chirp-package
        path: dist/
        retention-days: 30

    - name: Upload coverage reports
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
