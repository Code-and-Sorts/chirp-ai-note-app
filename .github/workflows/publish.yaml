name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      is-test-pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        type: boolean
        default: false
  release:
    types:
      - published

jobs:
  build-and-test:
    uses: ./.github/workflows/shared-build-and-test.yaml
    with:
      python-version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.python-version || '3.11' }}
      os-matrix: '["macos-latest"]'
      upload-artifacts: true
      update-version-for-pr: false
      package-version: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      run-integration-tests: false

  publish-package:
    needs: build-and-test
    uses: ./.github/workflows/shared-publish-package.yaml
    with:
      python-version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.python-version || '3.11' }}
      is-test-pypi: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.is-test-pypi == 'true' }}
    secrets: inherit
    permissions:
      pull-requests: write
      id-token: write

  sync-version-to-main:
    needs: publish-package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: ⤵️ Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: 🏷️ Update pyproject.toml to released version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: cd scripts && uv run python update_release_version.py

      - name: 🔒 Regenerate uv.lock to match new project version
        run: uv lock

      - name: 🔎 Read normalized version
        id: version
        run: |
          NORMALIZED_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "normalized=${NORMALIZED_VERSION}" >> "$GITHUB_OUTPUT"

      - name: 📥 Open PR to sync version on main
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: chore/sync-pyproject-to-${{ steps.version.outputs.normalized }}
          delete-branch: true
          commit-message: "chore: sync pyproject.toml to released version ${{ steps.version.outputs.normalized }}"
          title: "chore: sync pyproject.toml to released version ${{ steps.version.outputs.normalized }}"
          body: |
            Automated sync after publishing release [`${{ github.event.release.tag_name }}`](${{ github.event.release.html_url }}).

            Updates `pyproject.toml`'s `[project].version` to `${{ steps.version.outputs.normalized }}` and regenerates `uv.lock` so future PR dev builds derive their version from the latest released base. Without this, PR builds would continue versioning off the previous `pyproject.toml`, and PEP 440 ordering could prevent `pip install --upgrade chirp-notes-ai` from picking up new releases.
          labels: |
            automation
            release-sync
          add-paths: |
            pyproject.toml
            uv.lock
