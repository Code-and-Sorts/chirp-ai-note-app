name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      is-test-pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        type: boolean
        default: false
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/shared-build-and-test.yaml
    permissions:
      contents: read
    with:
      python-version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.python-version || '3.11' }}
      os-matrix: '["macos-latest"]'
      upload-artifacts: true
      update-version-for-pr: false
      package-version: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      run-integration-tests: false

  publish-package:
    needs: build-and-test
    uses: ./.github/workflows/shared-publish-package.yaml
    with:
      python-version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.python-version || '3.11' }}
      is-test-pypi: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.is-test-pypi == 'true' }}
    secrets: inherit
    permissions:
      pull-requests: write
      id-token: write

  sync-version-to-main:
    needs: publish-package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: ⤵️ Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: 🏷️ Update pyproject.toml to released version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: cd scripts && uv run python update_release_version.py

      - name: 🔒 Regenerate uv.lock to match new project version
        run: uv lock

      - name: 🔎 Read normalized version
        id: version
        run: |
          NORMALIZED_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "normalized=${NORMALIZED_VERSION}" >> "$GITHUB_OUTPUT"

      - name: 📥 Open PR to sync version on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NORMALIZED_VERSION: ${{ steps.version.outputs.normalized }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail

          BRANCH="chore/sync-pyproject-to-${NORMALIZED_VERSION}"
          TITLE="chore: sync pyproject.toml to released version ${NORMALIZED_VERSION}"

          if [[ -z "$(git status --porcelain pyproject.toml uv.lock)" ]]; then
            echo "No changes to pyproject.toml or uv.lock; skipping PR."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pyproject.toml uv.lock
          git commit -m "$TITLE"
          git push --force-with-lease origin "$BRANCH"

          BODY=$(cat <<EOF
          Automated sync after publishing release [\`${RELEASE_TAG}\`](${RELEASE_URL}).

          Updates \`pyproject.toml\`'s \`[project].version\` to \`${NORMALIZED_VERSION}\` and regenerates \`uv.lock\` so future PR dev builds derive their version from the latest released base. Without this, PR builds would continue versioning off the previous \`pyproject.toml\`, and PEP 440 ordering could prevent \`pip install --upgrade chirp-notes-ai\` from picking up new releases.
          EOF
          )

          if EXISTING=$(gh pr view "$BRANCH" --json number --jq .number 2>/dev/null); then
            echo "PR #${EXISTING} already exists for ${BRANCH}; updated branch in place."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY" \
              --label automation \
              --label release-sync
          fi
