name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      is-test-pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        type: boolean
        default: false
  release:
    types:
      - created

jobs:
  build-and-test:
    uses: ./.github/workflows/shared-build-and-test.yaml
    with:
      python-version: ${{ inputs.python-version || '3.11' }}
      os-matrix: '["macos-latest"]'
      upload-artifacts: true
      update-version-for-pr: false
      package-version: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      run-integration-tests: false

  publish-package:
    needs: build-and-test
    uses: ./.github/workflows/shared-publish-package.yaml
    with:
      python-version: ${{ inputs.python-version || '3.11' }}
      is-test-pypi: ${{ github.event_name != 'release' && inputs.is-test-pypi }}
    secrets: inherit
