name: Build and Test

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Primary Python version (used for artifacts and publishing)'
        required: false
        type: string
        default: '3.11'
      python-matrix:
        description: 'Python versions to test on (JSON array); must include python-version'
        required: false
        type: string
        default: '["3.11"]'
      os-matrix:
        description: 'Operating systems to test on (JSON array)'
        required: false
        type: string
        default: '["macos-latest", "windows-latest"]'
      upload-artifacts:
        description: 'Whether to upload build artifacts'
        required: false
        type: boolean
        default: true
      artifact-name:
        description: 'Name for the uploaded artifacts'
        required: false
        type: string
        default: 'python-package-dist'
      update-version-for-pr:
        description: 'Whether to update version for PR builds'
        required: false
        type: boolean
        default: false
      package-version:
        description: 'Exact package version to build'
        required: false
        type: string
        default: ''
      run-integration-tests:
        description: 'Whether to run integration tests'
        required: false
        type: boolean
        default: false
      require-signing:
        description: 'Fail the build when Developer ID signing secrets are absent (set for PyPI releases)'
        required: false
        type: boolean
        default: false
    secrets:
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
    outputs:
      build-successful:
        description: 'Whether the build was successful'
        value: 'true'

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
        python-version: ${{ fromJson(inputs.python-matrix) }}

    steps:
    - name: ⤵️ Checkout code
      uses: actions/checkout@v7

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: 🚀 Install uv with caching
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true

    - name: 📦 Cache apt packages (Linux)
      if: runner.os == 'Linux'
      uses: actions/cache@v6
      with:
        path: /var/cache/apt
        key: ${{ runner.os }}-apt-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: 🔧 Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev python3-dev

    - name: 🔧 Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        # Windows sounddevice wheels bundle PortAudio, no system deps needed
        echo "Windows uses precompiled wheels"

    - name: 🔗 Check lock file consistency (uv.lock)
      run: uv lock --check

    - name: ♻️ Cache .venv
      uses: actions/cache@v6
      with:
        path: .venv
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-venv-${{ hashFiles('pyproject.toml', 'scripts/pyproject.toml') }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ matrix.python-version }}-venv-${{ hashFiles('pyproject.toml', 'scripts/pyproject.toml') }}-
          ${{ runner.os }}-python-${{ matrix.python-version }}-venv-

    - name: ✅ Install dependencies
      run: uv sync --dev

    - name: ✨ Lint with Ruff using uv
      run: |
        uv pip install --system -e .[dev]
        uv run ruff check --output-format=github .

    - name: ⬆️ Update version in pyproject.toml for PR
      if: inputs.update-version-for-pr
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_NUMBER: ${{ github.run_number }}
      run: cd scripts && uv run python update_pr_version.py

    - name: 🏷️ Update version in pyproject.toml from release tag
      if: inputs.package-version != ''
      env:
        RELEASE_TAG: ${{ inputs.package-version }}
      run: cd scripts && uv run python update_release_version.py

    - name: 🔎 Check Developer ID signing secrets (macOS only)
      id: signing
      if: runner.os == 'macOS'
      env:
        CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      run: |
        if [ -n "$CERT_P12" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        elif [ "${{ inputs.require-signing }}" = "true" ]; then
          echo "::error::Developer ID signing secrets are required for this build (require-signing=true) but MACOS_CERT_P12 is not set. Refusing to ship an ad-hoc-signed Chirp.app — it breaks Gatekeeper/TCC permission persistence on user machines." >&2
          exit 1
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: 🔑 Import Developer ID certificate (macOS, when secrets present)
      if: ${{ runner.os == 'macOS' && steps.signing.outputs.enabled == 'true' }}
      uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
      with:
        p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
        p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

    - name: 🍎 Build native audio_capture helper (macOS only)
      if: runner.os == 'macOS'
      # MUST run after the version-bump steps above and before the wheel build:
      # the Swift Makefile stamps Info.plist from pyproject's version at build
      # time, and the wheel bundles the code-signed Chirp.app whose signature is
      # the helper's TCC (Screen-Recording/Mic) permission identity
      # (com.codeandsorts.chirp.capture-audio). Reordering would ship a stale
      # version or an unsigned helper.
      env:
        CHIRP_CODESIGN_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
      run: uv run python -m audio_capture.build

    - name: 🔖 Verify bundled helper version matches pyproject (macOS only)
      if: runner.os == 'macOS'
      run: |
        plist="audio_capture/Chirp.app/Contents/Info.plist"
        bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
        project_version=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
        echo "bundle=$bundle_version project=$project_version"
        if [ "$bundle_version" != "$project_version" ]; then
          echo "::error::Chirp.app Info.plist version ($bundle_version) != pyproject version ($project_version); rebuild the helper after the version bump." >&2
          exit 1
        fi

    - name: 🏗️ Build wheel
      # macOS-only: the wheel must bundle the arm64 helper and carry the
      # macosx_*_arm64 tag. Building on a non-macOS runner would emit a
      # py3-none-any wheel — exactly the mistag this story exists to prevent.
      # Wheel-only distribution: we never build or publish an sdist, because the
      # helper can only be produced on a macOS host with Xcode CLT and a
      # user-side rebuild would break the TCC identity.
      if: runner.os == 'macOS'
      run: uv build --wheel

    - name: ✅ Validate wheel metadata
      if: runner.os == 'macOS'
      # Only the wheel — `dist/` also holds the CI-written VERSION.txt, which
      # `twine check` rejects as an unknown distribution format.
      run: uvx twine check dist/*.whl

    - name: 🧪 Run unit tests
      run: uv run pytest --cov --cov-report=term

    - name: 📤 Upload build artifacts
      if: ${{ inputs.upload-artifacts && matrix.python-version == inputs.python-version }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/
        retention-days: 30

  integration-test:
    if: ${{ inputs.run-integration-tests }}
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}

    steps:
    - name: ⤵️ Checkout code
      uses: actions/checkout@v7

    - name: 🐍 Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: 🚀 Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

    - name: ⤵️ Download dist artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/

    - name: 🧪 Install wheel and smoke-test the CLI
      run: |
        set -euo pipefail
        uv venv "$RUNNER_TEMP/smoke-env"
        source "$RUNNER_TEMP/smoke-env/bin/activate"
        uv pip install dist/*.whl
        mkdir "$RUNNER_TEMP/smoke-cwd"
        cd "$RUNNER_TEMP/smoke-cwd"
        chirp --version
        chirp --help >/dev/null
        command -v chirpd
        python -c "import chirpd.__main__"
        python -c "import chirp.cli, chirpd, config.settings, llm.client, notes, notes_chat, recorder, transcriber, utils.file_utils"
        if [ "$(uname)" = "Darwin" ]; then
          python - <<'PY'
        import pathlib, sys

        import audio_capture

        bundle = pathlib.Path(audio_capture.__file__).parent / "Chirp.app"
        sys.exit(0 if bundle.is_dir() else "Chirp.app helper missing from installed wheel")
        PY
        fi
