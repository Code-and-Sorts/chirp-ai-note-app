name: PR Quality Checks

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-checks:
    if: github.event.pull_request.draft == false
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: ⤵️ Checkout code
        uses: actions/checkout@v6

      - name: 🔎 Run quality checks (format, lint, spell, type, validate)
        uses: ./.github/actions/quality-checks
        with:
          python-version: '3.11'

  validate-gh-aw:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/shared-validate-gh-aw.yaml
    permissions:
      contents: read

  build-and-test:
    needs: quality-checks
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/shared-build-and-test.yaml
    permissions:
      contents: read
    with:
      python-version: '3.11'
      os-matrix: '["macos-latest"]'
      upload-artifacts: true
      update-version-for-pr: true
      run-integration-tests: false

  publish-to-test-pypi:
    needs: build-and-test
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/shared-publish-package.yaml
    with:
      python-version: '3.11'
      is-test-pypi: true
    secrets: inherit
    permissions:
      pull-requests: write
      id-token: write
