repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        args: [--write-changes]  # Auto-fix typos
        # Optional: only check specific file types
        files: \.(py|md|yaml|yml|txt|rst)$
        # Verbatim regression-corpus transcripts/notes must not be auto-edited.
        exclude: '^tests/regression/notes_quality/'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(\.github/workflows/.*\.lock\.yml|tests/regression/notes_quality/.*)$'
      - id: end-of-file-fixer
        exclude: '^(\.github/workflows/.*\.lock\.yml|tests/regression/notes_quality/.*)$'
      - id: check-yaml
      - id: check-merge-conflict

  # Type checking — run through the project env (uv) so it matches
  # `make check` / CI exactly: resolves chromadb/mlx/etc. types and the
  # pyproject `files`/`warn_unused_ignores` config, instead of an isolated
  # mirrors-mypy env that can't see runtime deps (which produced spurious
  # unused-ignore errors on the chromadb type: ignore[arg-type] comments).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
