[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chirp-notes-ai"
version = "0.0.5-alpha"
description = "Meeting recorder CLI that transcribes and generates AI notes"
authors = [{name = "Colby Timm"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["meetings", "transcription", "whisper", "notes", "mlx", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=14.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "tomli-w>=1.0.0",
    "pyyaml>=6.0.0",
    "sounddevice>=0.5.0",
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.0",
    "rapidfuzz>=3.0.0",
    "python-dateutil>=2.8.0",
    "platformdirs>=4.0.0",
    "prompt-toolkit>=3.0.52",
    "numpy>=1.24.0",
    "silero-vad>=5.1",
    "truststore>=0.10.0",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-embeddings==0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub>=1.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/Code-and-Sorts/chirp-ai-note-app"
Repository = "https://github.com/Code-and-Sorts/chirp-ai-note-app"
Issues = "https://github.com/Code-and-Sorts/chirp-ai-note-app/issues"
Changelog = "https://github.com/Code-and-Sorts/chirp-ai-note-app/blob/main/CHANGELOG.md"

[project.scripts]
chirp = "chirp.cli:app"
chirpd = "chirpd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["audio_capture", "chirp", "chirpd", "config", "llm", "notes", "notes_chat", "recorder", "transcriber", "utils"]

[tool.hatch.build.hooks.custom]
# hatch_build.py conditionally includes Chirp.app when present

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "freezegun>=1.2.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-python-dateutil>=2.8.0",
    "types-PyYAML>=6.0.0",
    "codespell>=2.2.0",
    "pre-commit>=3.0.0",
    "pyyaml>=6.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["audio_capture/swift", "audio_capture/Chirp.app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "BLE",  # flake8-blind-except (BLE001: bare/blind `except` swallows errors)
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "TD",   # flake8-todos
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
    "PERF", # perflint
    "PT",   # flake8-pytest-style
    "ASYNC", # flake8-async (blocking calls in async functions)
    "PGH",  # pygrep-hooks (blanket noqa / type: ignore)
    "PIE",  # flake8-pie
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (typer pattern)
    "F403", # star imports (used intentionally for exceptions)
    "F405", # may be undefined from star imports
    "B904", # Within except clause, raise exceptions with raise ... from err (too verbose for this use case)
    "E722", # Do not use bare except (acceptable in test function)
    "ISC001", # implicit string concat on one line (conflicts with the formatter)
    "SIM105", # contextlib.suppress is slower and not always clearer than try/except: pass
    "TD002", # missing TODO author (not a team convention)
    "TD003", # missing TODO issue link (not a team convention)
    "RUF001", # ambiguous unicode in strings (intentional em-dashes/quotes in user-facing notes text)
    "RUF002", # ambiguous unicode in docstrings (same rationale as RUF001)
    "RUF003", # ambiguous unicode in comments (same rationale as RUF001)
    "ASYNC240", # advises trio.Path/anyio.path; this project is asyncio-only, so pathlib in async is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ASYNC109", # test helpers legitimately take a `timeout` parameter
    "ASYNC110", # tests intentionally poll with `await asyncio.sleep` while waiting on external state
    "PERF",     # perflint targets production hot paths; test clarity wins over micro-perf, and stream-consume loops must collect partial results before a raise
    "SIM117",   # nested `with mock.patch(...)` is a readable pytest idiom; flattening deep patch stacks adds no clarity (rule stays active for production code)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["audio_capture", "chirp", "chirpd", "config", "llm", "notes", "notes_chat", "recorder", "transcriber", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "real_platform: skip the auto-darwin sys.platform patch in audio_capture tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["audio_capture", "chirp", "chirpd", "config", "llm", "notes", "notes_chat", "recorder", "transcriber", "utils"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
# Single source of truth for the coverage floor, honored by every path that
# runs `--cov` + a report (both workflows, `make ci`, `make test-coverage`).
# Set just below the measured TOTAL (84% with 8.5 landed) to absorb run-to-run
# variance from the MLX `# pragma: no cover` paths and platform-skipped audio
# tests. Ratchet toward 84%+ as cli.py coverage continues to rise.
fail_under = 82
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Staged tightening (story 8.6, stage 1): two cheap flags that add type
# discipline without churn. `ignore_missing_imports` stays true because
# MLX/chromadb/silero ship no stubs. Stage 2 (follow-up): per-module
# `[[tool.mypy.overrides]]` with `disallow_untyped_defs = true` for the new
# typed surfaces (chirp, llm, chirpd, registry), ratcheting outward.
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["audio_capture", "chirp", "chirpd", "config", "llm", "notes", "notes_chat", "recorder", "transcriber", "utils"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "freezegun>=1.2.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-python-dateutil>=2.8.0",
    "types-PyYAML>=6.0.0",
    "codespell>=2.2.0",
    "pre-commit>=3.0.0",
    "pyyaml>=6.0.0",
]
