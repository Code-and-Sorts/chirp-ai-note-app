[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chirp-notes-ai"
version = "0.0.1a0"
description = "Meeting recorder CLI that transcribes and generates AI notes"
authors = [{name = "Colby Timm"}]
readme = "scripts/README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=14.1.0",
    "pydantic>=2.0.0",
    "tomli-w>=1.0.0",
    "pyaudio>=0.2.11",
    "faster-whisper>=1.0.0",
    "ollama>=0.1.0",
    "requests>=2.31.0",
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.0",
    "python-dateutil>=2.8.0",
    "platformdirs>=4.0.0",
    "prompt-toolkit>=3.0.52",
    "numpy>=1.24.0",
    "silero-vad>=5.1",
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub>=1.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "psutil>=5.9",
]

[project.scripts]
chirp = "chirp.cli:app"
chirpd = "chirpd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["audio_capture", "chirp", "chirpd", "config", "llm", "notes", "notes_chat", "recorder", "transcriber", "utils"]

[tool.hatch.build.hooks.custom]
# hatch_build.py conditionally includes CaptureAudio.app when present

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "freezegun>=1.2.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.8.0",
    "codespell>=2.2.0",
    "pre-commit>=3.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["audio_capture/swift", "audio_capture/CaptureAudio.app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "BLE", # flake8-blind-except (BLE001: bare/blind `except` swallows errors)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (typer pattern)
    "F403", # star imports (used intentionally for exceptions)
    "F405", # may be undefined from star imports
    "B904", # Within except clause, raise exceptions with raise ... from err (too verbose for this use case)
    "E722", # Do not use bare except (acceptable in test function)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["audio_capture", "chirp", "chirpd", "config", "llm", "notes", "notes_chat", "recorder", "transcriber", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "real_platform: skip the auto-darwin sys.platform patch in audio_capture tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["audio_capture", "chirp", "chirpd", "config", "llm", "notes", "notes_chat", "recorder", "transcriber", "utils"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["audio_capture", "chirp", "chirpd", "config", "llm", "notes", "notes_chat", "recorder", "transcriber", "utils"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "freezegun>=1.2.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.8.0",
    "codespell>=2.2.0",
    "pre-commit>=3.0.0",
]
